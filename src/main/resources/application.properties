# spring.application.name=laptopshop
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework


# spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:3306/laptopshop
# spring.datasource.username=root
# spring.datasource.password=123456

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# Change code to true to enable Hibernate's automatic schema generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.file.name=logs/application.log
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuration for Spring Security
# spring.security.user.name=minh
# spring.security.user.password=123456

# Configuration for JSP / View Engine
spring.mvc.view.prefix=/WEB-INF/view/
spring.mvc.view.suffix=.jsp

# default = 1MB
spring.servlet.multipart.max-file-size=50MB
# default = 10 MB (form data)
spring.servlet.multipart.max-request-size=50MB

# Enable Spring Security debug mode
# logging.level.org.springframework.security=DEBUG

# Config session
# spring.session.store-type=jdbc
# spring.session.timeout=30m
# spring.session.jdbc.initialize-schema=always

spring.session.store-type=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax


spring.web.locale=vi_VN
spring.web.locale-resolver=fixed
spring.main.allow-bean-definition-overriding=true
